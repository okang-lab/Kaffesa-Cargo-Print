<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:,">
<title>Kaffesa Personel</title>
<style>
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:#f6f6f5;color:#111;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;display:grid;place-items:center;padding:24px}
  .box{width:100%;max-width:360px;background:#fff;border:1px solid #e4e4e2;border-radius:16px;padding:36px 32px 32px}
  .logo{display:block;height:30px;margin:0 auto 26px}
  h1{font-size:13px;letter-spacing:.14em;text-transform:uppercase;text-align:center;color:#8a8a8a;font-weight:600;margin:0 0 24px}
  label{display:block;font-size:14px;font-weight:500;margin-bottom:8px}
  input[type=password]{width:100%;font:inherit;border:1px solid #d2d2cf;border-radius:10px;padding:11px 12px;background:#fff}
  input[type=password]:focus{outline:2px solid #111;outline-offset:1px;border-color:#111}
  .remember{display:flex;align-items:center;gap:8px;font-size:13px;color:#555;margin:14px 0 20px;cursor:pointer}
  .remember input{accent-color:#111;width:16px;height:16px;margin:0}
  button{width:100%;font:inherit;font-weight:500;border:0;border-radius:999px;padding:12px;background:#111;color:#fff;cursor:pointer}
  button:hover{background:#333}
  button[disabled]{opacity:.6;cursor:default}
  .err{min-height:22px;margin:12px 0 0;text-align:center;font-size:14px;color:#b00020}
  noscript p{max-width:360px;text-align:center}
</style>
</head>
<body>
<form class="box" id="f" autocomplete="off">
  <img class="logo" src="data:image/png;base64,{{LOGO_UI}}" alt="kaffesa">
  <h1>Personel Girişi</h1>
  <label for="pw">Şifre</label>
  <input type="password" id="pw" required autofocus autocomplete="current-password" inputmode="{{INPUTMODE}}">
  <label class="remember"><input type="checkbox" id="rem"> Bu bilgisayarda beni hatırla</label>
  <button type="submit" id="go">Giriş</button>
  <p class="err" id="err" role="alert"></p>
</form>
<noscript><p>Bu sayfa için JavaScript gereklidir.</p></noscript>
<script>
(function () {
  "use strict";
  // Şifreli içerik (AES-256-GCM, anahtar PBKDF2-SHA256 ile şifreden türetilir)
  var P = {{PAYLOAD}};
  var KEY = "kaffesa-app-key";
  var $ = function (id) { return document.getElementById(id); };
  var b64 = function (s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); };
  var tob64 = function (buf) { var s = "", a = new Uint8Array(buf); for (var i = 0; i < a.length; i++) s += String.fromCharCode(a[i]); return btoa(s); };
  var store = {
    get: function () { try { return sessionStorage.getItem(KEY) || localStorage.getItem(KEY); } catch (e) { return null; } },
    set: function (v, remember) { try { (remember ? localStorage : sessionStorage).setItem(KEY, v); } catch (e) {} },
    clear: function () { try { sessionStorage.removeItem(KEY); localStorage.removeItem(KEY); } catch (e) {} }
  };

  if (!window.crypto || !crypto.subtle) {
    $("err").textContent = "Bu tarayıcı desteklenmiyor. Lütfen güncel Chrome, Edge veya Safari kullanın.";
    $("go").disabled = true;
    return;
  }

  function decrypt(rawKey) {
    return crypto.subtle.importKey("raw", rawKey, { name: "AES-GCM" }, false, ["decrypt"])
      .then(function (key) { return crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(P.iv) }, key, b64(P.data)); })
      .then(function (plain) { return new TextDecoder().decode(plain); });
  }
  function show(html) {
    var go = function () { document.open(); document.write(html); document.close(); };
    // Sayfa hâlâ yükleniyorsa önce bitmesini bekle (yoksa içerik eski sayfaya eklenir)
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", go);
    else go();
  }

  function derive(password) {
    return crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveBits"])
      .then(function (base) {
        return crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: b64(P.salt), iterations: P.iter }, base, 256);
      });
  }

  // Daha önce giriş yapıldıysa doğrudan aç
  var saved = store.get();
  if (saved) {
    document.body.style.visibility = "hidden";
    decrypt(b64(saved)).then(show, function () { store.clear(); document.body.style.visibility = ""; });
  }

  $("f").addEventListener("submit", function (e) {
    e.preventDefault();
    var pw = $("pw").value, remember = $("rem").checked;
    if (!pw) return;
    $("go").disabled = true; $("go").textContent = "Açılıyor…"; $("err").textContent = "";
    var raw;
    derive(pw)
      .then(function (bits) { raw = bits; return decrypt(bits); })
      .then(function (html) { store.set(tob64(raw), remember); show(html); })
      .catch(function () {
        $("err").textContent = "Şifre hatalı.";
        $("go").disabled = false; $("go").textContent = "Giriş";
        $("pw").select();
      });
  });
})();
</script>
</body>
</html>
